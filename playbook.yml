---
- name: Configure Apache web server
  hosts: webservers
  become: true
  tasks:
    - name: Deploy custom webpage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "Deployed Using Ansible - AWS EC2"

    - name: Ensure Apache is running
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
